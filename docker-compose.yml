version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: digital_pusher_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: digital_pusher_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ai-mock:
    build:
      context: .
      dockerfile: services/ai-mock/Dockerfile
    container_name: digital_pusher_ai_mock
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=development

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: digital_pusher_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/digital_pusher
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-mock:5001
      - JWT_SECRET=super_secret_jwt_key_for_hackathon_demo_32chars!
      - JWT_EXPIRES_IN=1d
      - STORAGE_TYPE=local
      - STORAGE_PATH=./uploads
      - STORAGE_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-mock:
        condition: service_started
    volumes:
      - uploads_data:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: digital_pusher_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000/api
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
  uploads_data:
